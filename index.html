<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torrenueva FS</title>
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080E1A" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="senior/icon-192.png">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<main class="landing">
  <div>
    <span class="eyebrow">Temporada 2026/27</span>
    <h1 class="num" style="font-size:3.2rem;text-transform:uppercase;margin-top:8px">Torrenueva FS</h1>
    <p class="muted" style="margin-top:8px">Elige tu equipo. Cada uno tiene su propia app para instalar en el móvil.</p>
  </div>
  <a class="team-link" href="senior/" style="background:#16307F"><img src="senior/icon-192.png" alt=""><div><b>Senior</b><span>Torrenueva FS</span></div></a>
  <a class="team-link" href="juvenil/" style="background:#7A2A08"><img src="juvenil/icon-192.png" alt=""><div><b>Juvenil</b><span>Torrenueva FS Juvenil</span></div></a>
</main>
<script>
// Quita el service worker de la app antigua (temporada 25/26), si sigue registrado en la raíz.
navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => { if (new URL(r.scope).pathname === location.pathname.replace(/index\.html$/, '')) r.unregister(); }));
</script>
</body>
</html>
